/**:
  ros__parameters:
    topic_imu: /imu/data
    acc_ratio: false
    lidars: ["ASDT1"]
    ASDT1:
      topic_lidar: /asdt1/points
      lidar_type: ASDT1
      scan_line: 24
      blind: 1.0
      # Sony AS-DT1 same-axis design offset is LiDAR origin in IMU/body frame:
      # t_bl = [0.00356, 0.00810, -0.00785] m.
      # RESPLE stores T_lb in q_lb/t_lb and derives T_bl by inversion.
      q_lb: [1.0, 0.0, 0.0, 0.0]
      t_lb: [-0.00356, -0.00810, 0.00785]
      w_pt: 0.01
    lidar_time_offset: 0.0

    knot_hz: 20
    if_lidar_only: false

    ds_scan_voxel: 0.1
    point_filter_num: 1
    nn_thresh: 0.5
    coeff_cov: 10.0
    num_nn: 8

    ds_lm_voxel: 0.5
    cube_len: 1000.0

    cov_P0: 0.02
    cov_RCP_pos_old: 0.1
    cov_RCP_ort_old: 0.1
    cov_RCP_pos_new: 1.0
    cov_RCP_ort_new: 1.0
    std_sys_pos: 0.2
    std_sys_ort: 0.1
    n_iter: 1
    num_points_upd: 300

    cov_acc: [1.0, 1.0, 1.0]
    cov_gyro: [0.12, 0.12, 0.12]
    cov_ba: [0.2, 0.2, 0.2]
    cov_bg: [0.2, 0.2, 0.2]
